<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Clock</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Life Clock</h1>
    <div class="clock">
        <div class="clock__face">
            <div class="year-hand">00:</div> <!--how to mak etis in a horizontal-->
            <div class="month-hand">00:</div>
            <div class="day-hand">00:</div>
            <div class="hour-hand">00:</div>
            <div class="min-hand">00:</div>
            <div class="second-hand">00</div>
        </div>
    </div>
    <!--best way to ask 10-15 questions to the user? -->
    <div class="data">
        <input type="calender">
    </div>
    <script src="script.js" defer>
    </script>
</body>

</html>
